         - name: Write proof summary and provenance
           if: always()
           shell: bash
           env:
              C1_RESOLVED: ${{ steps.c1_source.outputs.resolved_sha }}
              FIXED_RESOLVED: ${{ steps.fixed_source.outputs.resolved_sha }}
              CANDIDATE_RESOLVED: ${{ steps.candidate_source.outputs.resolved_sha }}
              C1_SOURCE_OUTCOME: ${{ steps.c1_source.outcome }}
              C1_BUILD_OUTCOME: ${{ steps.c1_build.outcome }}
              C1_TEST_OUTCOME: ${{ steps.c1_test.outcome }}
              C1_TEST_CONCLUSION: ${{ steps.c1_test.conclusion }}
              C1_CLASSIFIER_OUTCOME: ${{ steps.c1_expected_red.outcome }}
              FIXED_SOURCE_OUTCOME: ${{ steps.fixed_source.outcome }}
              FIXED_TESTS_OUTCOME: ${{ steps.fixed_tests.outcome }}
              CANDIDATE_SOURCE_OUTCOME: ${{ steps.candidate_source.outcome }}
              CANDIDATE_TESTS_OUTCOME: ${{ steps.candidate_rust_tests.outcome }}
              CANDIDATE_TEST_EVIDENCE_OUTCOME: ${{ steps.candidate_test_evidence.outcome }}
              CLIPPY_STRICT_OUTCOME: ${{ steps.clippy_strict.outcome }}
              CLIPPY_DEFAULT_OUTCOME: ${{ steps.clippy_default.outcome }}
              CLIPPY_PORTED_OUTCOME: ${{ steps.clippy_ported.outcome }}
              RUSTFMT_OUTCOME: ${{ steps.rustfmt.outcome }}
           run: |
              set -euo pipefail
              python3 - "$EVIDENCE_DIR/provenance.json" "$EVIDENCE_DIR/summary.json" <<'PY'
              import json
              import os
              import sys

              c1_green = (
                  os.environ.get("C1_SOURCE_OUTCOME") == "success"
                  and os.environ.get("C1_BUILD_OUTCOME") == "success"
                  and os.environ.get("C1_CLASSIFIER_OUTCOME") == "success"
              )
              fixed_green = (
                  os.environ.get("FIXED_SOURCE_OUTCOME") == "success"
                  and os.environ.get("FIXED_TESTS_OUTCOME") == "success"
              )
              candidate_outcomes = {
                  "candidate_source": os.environ.get("CANDIDATE_SOURCE_OUTCOME", ""),
                  "rust_tests": os.environ.get("CANDIDATE_TESTS_OUTCOME", ""),
                  "test_evidence": os.environ.get("CANDIDATE_TEST_EVIDENCE_OUTCOME", ""),
                  "clippy_strict": os.environ.get("CLIPPY_STRICT_OUTCOME", ""),
                  "clippy_default": os.environ.get("CLIPPY_DEFAULT_OUTCOME", ""),
                  "clippy_ported": os.environ.get("CLIPPY_PORTED_OUTCOME", ""),
                  "rustfmt": os.environ.get("RUSTFMT_OUTCOME", ""),
              }
              candidate_green = all(
                  outcome == "success" for outcome in candidate_outcomes.values()
              )
              provenance = {
                  "workflow_sha": os.environ["GITHUB_SHA"],
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "runner_os": os.environ["RUNNER_OS"],
                  "runner_arch": os.environ["RUNNER_ARCH"],
                  "sources": {
                      "c1": {
                          "requested": os.environ["C1_SHA"],
                          "resolved": os.environ.get("C1_RESOLVED", ""),
                      },
                      "c2": {"requested": os.environ["C2_SHA"]},
                      "fixed": {
                          "requested": os.environ["FIXED_SHA"],
                          "resolved": os.environ.get("FIXED_RESOLVED", ""),
                      },
                      "candidate": {
                          "requested": os.environ["REQUESTED_CANDIDATE"],
                          "resolved": os.environ.get("CANDIDATE_RESOLVED", ""),
                      },
                  },
              }
              summary = {
                  "stages": {
                      "c1": {
                          "classification": "expected-red" if c1_green else "failure",
                          "source_outcome": os.environ.get("C1_SOURCE_OUTCOME", ""),
                          "build_outcome": os.environ.get("C1_BUILD_OUTCOME", ""),
                          "test_outcome": os.environ.get("C1_TEST_OUTCOME", ""),
                          "test_conclusion": os.environ.get("C1_TEST_CONCLUSION", ""),
                          "classifier_outcome": os.environ.get("C1_CLASSIFIER_OUTCOME", ""),
                      },
                      "fixed": {
                          "classification": "green" if fixed_green else "failure",
                          "source_outcome": os.environ.get("FIXED_SOURCE_OUTCOME", ""),
                          "tests_outcome": os.environ.get("FIXED_TESTS_OUTCOME", ""),
                      },
                      "candidate": {
                          "classification": "green" if candidate_green else "failure",
                          "outcomes": candidate_outcomes,
                      },
                  }
              }
              with open(sys.argv[1], "w", encoding="utf-8") as handle:
                  json.dump(provenance, handle, indent=2, sort_keys=True)
                  handle.write("\n")
              with open(sys.argv[2], "w", encoding="utf-8") as handle:
                  json.dump(summary, handle, indent=2, sort_keys=True)
                  handle.write("\n")
              PY

         - name: Upload Rust cancellation proof
           if: always()
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: pi-shell-cancellation-proof-${{ steps.candidate_input.outputs.candidate_sha }}
              path: ${{ runner.temp }}/pi-shell-cancellation-proof
              if-no-files-found: error
              retention-days: 14
   build_candidate_darwin_arm64:
      if: github.repository == 'jwaldrip/oh-my-pi' && github.ref == 'refs/heads/verify/cancellation-trace-20261022' && inputs.operation == 'darwin-addon'
      name: Build candidate Darwin arm64 native addon
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
           with:
              ref: ${{ inputs.candidate_ref }}
              fetch-depth: 1
              persist-credentials: false

         - name: Validate candidate source and native cache inputs
           id: provenance
           shell: bash
           env:
              REQUESTED_CANDIDATE: ${{ inputs.candidate_ref }}
              NATIVE_INPUTS_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
           run: |
              set -euo pipefail
              if ! [[ "$REQUESTED_CANDIDATE" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error::candidate_ref must be an immutable 40-character commit SHA"
                exit 1
              fi
              candidate_sha="$(git rev-parse --verify HEAD)"
              if [ "${candidate_sha,,}" != "${REQUESTED_CANDIDATE,,}" ]; then
                echo "::error::checkout resolved $candidate_sha instead of $REQUESTED_CANDIDATE"
                exit 1
              fi
              if [ -z "$NATIVE_INPUTS_HASH" ]; then
                echo "::error::native cache-input hash is empty"
                exit 1
              fi
              echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
              echo "native_inputs_hash=$NATIVE_INPUTS_HASH" >> "$GITHUB_OUTPUT"

         - id: cache
           uses: ./.github/actions/bazel-cache

         - name: Build Darwin arm64 native addon
           shell: bash
           env:
              BAZELRC: ${{ steps.cache.outputs.rc }}
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              : > "$RUNNER_TEMP/bazel-build.log"
              bazelisk --bazelrc="$BAZELRC" build "//:natives-darwin-arm64" 2>&1 | tee -a "$RUNNER_TEMP/bazel-build.log"

         - name: Stage candidate addon and provenance
           id: stage
           shell: bash
           env:
              BAZELRC: ${{ steps.cache.outputs.rc }}
              CANDIDATE_SHA: ${{ steps.provenance.outputs.candidate_sha }}
              NATIVE_INPUTS_HASH: ${{ steps.provenance.outputs.native_inputs_hash }}
           run: |
              set -euo pipefail
              source_node=bazel-bin/natives-darwin-arm64/pi_natives.darwin-arm64.node
              if [ ! -s "$source_node" ]; then
                echo "::error::Bazel did not produce $source_node"
                exit 1
              fi
              artifact_dir="$RUNNER_TEMP/candidate-darwin-arm64"
              mkdir -p "$artifact_dir"
              cp -L "$source_node" "$artifact_dir/pi_natives.darwin-arm64.node"
              cp "$RUNNER_TEMP/bazel-build.log" "$artifact_dir/bazel-build.log"
              node_sha256="$(sha256sum "$artifact_dir/pi_natives.darwin-arm64.node" | cut -d' ' -f1)"
              bazelrc_sha256="$(sha256sum "$BAZELRC" | cut -d' ' -f1)"
              toolchain_sha256="$(sha256sum rust-toolchain.toml | cut -d' ' -f1)"
              cat > "$artifact_dir/provenance.json" <<EOF
              {
                "candidate_sha": "$CANDIDATE_SHA",
                "native_inputs_hash": "$NATIVE_INPUTS_HASH",
                "target": "//:natives-darwin-arm64",
                "bazel_config": "ci",
                "bazelrc_sha256": "$bazelrc_sha256",
                "rust_toolchain_sha256": "$toolchain_sha256",
                "artifact": "pi_natives.darwin-arm64.node",
                "artifact_sha256": "$node_sha256"
              }
              EOF
              echo "artifact_sha256=$node_sha256" >> "$GITHUB_OUTPUT"

         - name: Upload candidate Darwin arm64 native addon
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: candidate-darwin-arm64-${{ steps.provenance.outputs.candidate_sha }}
              path: ${{ runner.temp }}/candidate-darwin-arm64
              if-no-files-found: error
              retention-days: 7
