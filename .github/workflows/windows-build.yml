name: Windows desktop build

on:
  pull_request:
    paths:
      - "control-plane/packages/app/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows-build.yml"
  push:
    branches:
      - feat/control-plane
    paths:
      - "control-plane/packages/app/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React Native Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build generated Windows solution
        shell: pwsh
        working-directory: control-plane/packages/app/windows
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild is not installed on this runner."
          }
          & $msbuild ompd.sln /m /restore /p:Configuration=Debug /p:Platform=x64
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
