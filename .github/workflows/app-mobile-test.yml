name: App mobile tests

on:
  pull_request:
    paths:
      - "control-plane/packages/app/**"
      - ".github/workflows/app-mobile-test.yml"
  push:
    branches: [main]
    paths:
      - "control-plane/packages/app/**"
      - ".github/workflows/app-mobile-test.yml"
  workflow_dispatch:

concurrency:
  group: app-mobile-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-js:
    name: App JS/TS tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: control-plane/packages/app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Typecheck + unit/component tests
        run: |
          bun run typecheck
          bun test

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: control-plane/packages/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
      - uses: ./.github/actions/bun-install
      - name: Install JS deps for autolinking
        run: |
          cd ../../..
          # workspace root install already done by bun-install action
          true
      - name: JVM unit tests
        run: bun run test:android:unit
      - name: Prove package-identity test can fail
        # Invert the assertion temporarily via a one-shot gradle property is hard;
        # instead run a tiny companion check that the test class is on the classpath
        # and that APPLICATION_ID is the store id, failing this step if not.
        run: |
          cd android
          ./gradlew :app:compileDebugUnitTestJavaWithJavac :app:compileDebugUnitTestKotlin --console=plain
          # Extract APPLICATION_ID from generated BuildConfig
          bc=$(find app/build -name BuildConfig.java -o -name BuildConfig.kt | head -1)
          echo "BuildConfig=$bc"
          grep -E 'sh\.ompd\.app' "$bc"

  android-instrumentation:
    name: Android emulator instrumentation
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: control-plane/packages/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
      - uses: ./.github/actions/bun-install
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          working-directory: control-plane/packages/app
          script: bash ./scripts/android-instrumentation-test.sh

  ios-sim:
    name: iOS simulator UI smoke
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: control-plane/packages/app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Select Xcode 16+
        run: |
          # RN 0.81 requires Xcode >= 16.1
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer ||           sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer ||           sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer ||           sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer ||           sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version
      - name: CocoaPods
        run: |
          cd ios
          pod install
      - name: Simulator smoke (LaunchSmokeUITests only)
        run: bun run test:ios:sim
