// Hoisted bun workspace: node_modules live at the monorepo root, not under
// packages/app. pluginManagement must be first; resolve the RN gradle plugin
// by walking up from this settings dir until package.json + node_modules exist.
pluginManagement {
  def monorepoRoot = {
    def dir = settingsDir
    while (dir != null) {
      if (new File(dir, "node_modules/@react-native/gradle-plugin/package.json").exists()) {
        return dir
      }
      dir = dir.parentFile
    }
    throw new GradleException(
      "Could not find node_modules/@react-native/gradle-plugin by walking up from ${settingsDir}. Run bun install at the monorepo root first.")
  }()
  def reactNativeGradlePlugin = new File(monorepoRoot, "node_modules/@react-native/gradle-plugin").absolutePath
  includeBuild(reactNativeGradlePlugin)
}

plugins { id("com.facebook.react.settings") }

def monorepoRoot = {
  def dir = rootDir
  while (dir != null) {
    if (new File(dir, "node_modules/@react-native/gradle-plugin/package.json").exists()) {
      return dir
    }
    dir = dir.parentFile
  }
  throw new GradleException("Could not find monorepo root from ${rootDir}")
}()
def reactNativeGradlePlugin = new File(monorepoRoot, "node_modules/@react-native/gradle-plugin").absolutePath

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  // Autolinking also needs to run with monorepo root on NODE_PATH
  ex.autolinkLibrariesFromCommand()
}
rootProject.name = 'ompd'
include ':app'
includeBuild(reactNativeGradlePlugin)
