# Builds the hub image from the repo root (build context) using the
# Dockerfile in this directory. `gcloud builds submit --tag` cannot do this:
# it hardcodes `docker build -t TAG .` against `./Dockerfile` in the source
# root with no flag to point at a different path, so this stack needs its
# own config rather than the implicit one.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "control-plane/packages/hub/deploy/Dockerfile", "-t", "${_IMAGE_TAG}", "."]
images: ["${_IMAGE_TAG}"]
